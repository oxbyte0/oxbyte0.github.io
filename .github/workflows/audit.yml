name: Dependency Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-audit:
    name: Ruby Gem Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install bundler-audit
        run: gem install bundler-audit

      - name: Run gem audit
        run: |
          bundle-audit check --update
          echo "Ruby audit complete"

  node-audit:
    name: Node.js Audit (admin-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
