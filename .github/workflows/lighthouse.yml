name: Lighthouse CI

on:
  workflow_run:
    workflows: ['Build & Deploy']
    types: [completed]

jobs:
  lighthouse:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse CI with performance budget
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://oxbyte.blog/
            https://oxbyte.blog/archive/
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      - name: Print results
        if: always()
        run: echo "Lighthouse results saved as artifact — check Actions tab for scores and budget diffs"
