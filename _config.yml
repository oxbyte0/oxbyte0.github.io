title: oxbyte
description: "HackTheBox machine writeups, CTF solutions, and offensive security research — retired boxes, AD attacks, web exploitation."
tagline: "Full exploitation chains, not spoiler dumps — enumeration through root, one retired box at a time."
url: "https://oxbyte.blog"
lang: en-US
timezone: UTC

# Injected by CI (deploy.yml) — leave blank here
google_analytics:
goatcounter:

author: "oxbyte"
social:
  name: oxbyte
  links:
    - https://github.com/oxbyte0

permalink: "/:title/"

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

feed:
  posts_limit: 20
  excerpt_only: true
excerpt_separator: "<!--more-->"

sass:
  style: compressed
  sourcemap: never

markdown: kramdown
kramdown:
  highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: oxbyte

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .obsidian/
  - .github/
  - .bundle/
  - .env
  - .env.example
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - scripts/
  - script/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
